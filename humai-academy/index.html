<!-- 1st tag that specifies document type as HTML5 for HuMAI Academy, ensures that the browser renders it correctly in standard mode -->
<!Doctype html>
<!-- 2nd tag that defines the start of the HTML document and specifies the language; English which is automatically added by VS Code -->
<html lang="en">
  <!-- 3rd tag that contains metadata information about the document like title, description, and links to resources -->
<head>
  <!-- 4th tag that ensures proper coding for the document and proper text rendering; which controls the character set encoding -->
  <meta charset="UTF-8" />
  <!-- 5th tag that ensures compatibility with Internet Explorer, contains viewport information, 
  indicating how the page should be rendered on different devices (screen width & zoom level); for Mobile Responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 6th tag that provides a brief description of the page for search engines and social media -->
  <meta name="description" content="HuMAI Academy: a playful AI literacy learning experience with HuMi." />
  <!-- 7th tag that specifies the title of the page that appears in the browser tab -->
  <title>HuMAI Academy</title>
  <!-- Add base href so HTML preview services resolve relative resources (images, CSS, JS) correctly -->
  <base href="https://raw.githack.com/jens808-hi/CSC256---Assignment-7.1---Final-Project/main/">
  <!-- 8th tag that links to the favicon image for the page, which appears in the browser tab 
  <link rel="icon" href="favicon.ico" /> -->
  <!-- 9th tag that links to the external CSS stylesheet for styling the page -->
  <link rel="stylesheet" href="./styles-hero-command.css" />
  <!-- 10th tag that links to the external JavaScript file for adding interactivity to the page -->
  <script type="module" src="app.js"></script>
<!-- Closing head tag - last line of the head element -->
</head>
  <!--11th tag that defines the start of the body element -->
  <body>
    <!-- 12th tag that defines the main container for the application, which includes the header, 
    navigation bar, mobile menu, dashboard, game rewards, HuMi Coach, popups, and every screen on the page -->
    <div class="app-interface-layer">
      <!-- Main application container -->
      <header class="topbar">
        <!-- 13th tag that defines a button for opening the mobile menu, with an icon and an accessible label -->
        <button class="icon-button mobile-menu" id="mobileMenuButton" aria-label="Open menu">☰</button>
        <!-- 14th tag that defines my HuMAI brand logo and link for the application, clicking this will 
        take the user to the Hero Command dashboard -->
        <button class="HuMAI" data-route="dashboard" aria-label="Go to HuMAI Academy dashboard">
          <!-- My brand logo -->
          <span class="HuMAI-bot">🤖</span>
          <!-- My brand name with emphasis on "Academy" -->
          <span>HuMAI <em>Academy</em></span>
          <!-- My brand subtitle -->
          <span class="HuMAI-subtitle">AI Literacy for Everyone</span>
        <!-- Closing button tag for the brand logo and link -->
        </button>
          <!-- 15th tag that defines the primary navigation menu for desktop users, with buttons for different routes and an accessible label -->
          <nav class="desktop-nav" aria-label="Primary navigation">
            <!-- Navigation links -->
            <button data-route="dashboard" class="nav-link active">Home</button>
            <button data-route="games" class="nav-link">Game Zone</button>
            <button data-route="rewards" class="nav-link">Rewards</button>
            <button data-route="coach" class="nav-link">Chat with HuMI</button>
          <!-- Closing nav tag for the primary navigation menu -->
          </nav>
        <!-- 16th tag that defines the action buttons for the topbar; XP, streak, sound, and profile controls -->
        <div class="topbar-actions">
          <!-- Streak chip -->
          <div class="streak-chip" title="Hero learning streak"><span>🔥</span><strong id="streakTop">3</strong><span class="streak-text">day streak</span></div>
          <!-- Experience points chip -->
          <div class="xp-chip" title="Total Energy XP"><span>⭐</span><strong id="xpTop">420</strong><span class="xp-text">XP</span></div>
          <!-- Sound toggle button -->
          <button class="icon-button" id="soundButton" aria-label="Toggle sounds" title="Toggle sounds">🔊</button>
          <!-- Profile button with avatar -->
          <button class="avatar-button" id="profileButton" aria-label="Open profile">A</button>
          <!-- Notification button -->
          <button class="icon-button" id="notificationButton" aria-label="Open notifications">🔔</button>
        <!-- Closing div tag for the topbar actions -->
        </div>
      <!-- Closing header tag for the topbar -->
      </header>
        <!-- 17th tag that defines the mobile navigation menu, with buttons for different routes and an accessible label -->
        <aside class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
          <!-- Mobile navigation links -->
          <button data-route="dashboard">🏠 Home</button>
          <button data-route="games">🎮 Game Zone</button>
          <button data-route="rewards">🏆 Rewards</button>
          <button data-route="coach">🤖 Chat with HuMi</button>
            <!--Navigation link that opens an external tutorial about using JavaScript modules, opens the tutorial in a new tab so the HuMAI Academy
            page stays open in the current tab (rel="noopener noreferrer" is a standard safety setting for external links) -->
            <a  class="nav-link tutorial-link" href="https://www.youtube.com/watch?v=7QUhW3KhJiA" target="_blank" rel="noopener noreferrer">📚 Learn JavaScript Modules Tutorial</a>
            <!-- Navigation link that opens a tutorial about building games with HTML, CSS, and JavaScript -->
            <a class="nav-link tutorial-link" href="https://www.youtube.com/watch?v=GFO_txvwK_c" target="_blank" rel="noopener noreferrer">🎮 Learn JavaScript Game Tutorial</a>  
        <!-- Closing aside tag for the mobile navigation menu -->
      </aside>
